[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["${MQTT_TOPIC}"]
  topic_tag = "sensor"
  qos = 0
  data_format = "json"
  tag_keys = ["nid"]
  name_override = "telemetry"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "kelo/nid/+/telemetry"
    tags = "_/_/nid/_"

[[processors.rename]]
  [[processors.rename.replace]]
    field = "temp"
    dest = "temperature"

  [[processors.rename.replace]]
    field = "humidity"
    dest = "humidite"

  [[processors.rename.replace]]
    field = "hum"
    dest = "humidite"

  [[processors.starlark]]
    source = '''
  load("math.star", "math")

  def apply(metric):
    if "vibration" in metric.fields:
      return metric

    required_axes = ["ax", "ay", "az"]
    for axis_name in required_axes:
      if axis_name not in metric.fields:
        return metric

    axis_values = []
    for axis_name in required_axes:
      axis_values.append(float(metric.fields[axis_name]))

    metric.fields["vibration"] = math.sqrt(
      axis_values[0] * axis_values[0] +
      axis_values[1] * axis_values[1] +
      axis_values[2] * axis_values[2]
    )
    return metric
  '''

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
